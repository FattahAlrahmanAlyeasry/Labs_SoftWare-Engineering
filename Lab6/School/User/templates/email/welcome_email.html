<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>مرحبًا بك في نظام إدارة المدرسة</title>

        }

            max-width: 600px;
            margin: 0 auto;

            text-align: center;
        }
        p {
            line-height: 1.6;

        }

        }

<body>
    <div class="container">
        <h1>مرحبًا {{ username }}!</h1>

        <p>يمكنك تسجيل الدخول الآن باستخدام اسم المستخدم وكلمة المرور الخاصة بك.</p>
        <div class="footer">
            <p>تحيات،<br>فريق إدارة المدرسة</p>

</html>
